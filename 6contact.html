    <style>
        /* CSS Styling */
        :root {
            --primary-bg: #FCDEDEF4;
            --secondary-bg: #FFFBFB;
            --text-color: #333;
            --accent-color: #007bff;
        }

        body {
            font-family: 'Cute Font';
            margin: 0;
            color: var(--text-color);
            background-color: var(--secondary-bg);
            padding: 0rem 0%;
            line-height: 1.3 ;
        }

        header {
            background: var(--primary-bg);
            padding: 1.6rem 0%;
            text-margin: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgb(221,160,160);
            position: sticky;
            top: 0;
            z-index: 1000;
        }
      foot {
            background: var(--primary-bg);
            padding: 1.6rem 0%;
            text-margin: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            bottom: 0;
            z-index: 1000
        
      }
      
      .foot {
            height: 20vh;
            text-margin-left: 20px;
            text-margin-right: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            background: var(--secondary-bg);
      }

       nav a {
            margin-left: 20px;
            text-decoration: none;
            color: var(--text-color);
            font-weight: 500;
        }

        .hero {
            height: 80vh;
            margin-left: 300px;
            line-height: .9 ;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center-left;
            text-align: center-left;
            background: var(--secondary-bg);
        }

        .projects {
            padding: 4rem 5%;
        }

        .filter-buttons {
            margin-bottom: 2rem;
            text-align: center;
        }
      
        button {
            padding: 10px 20px;
            margin: 5px;
            cursor: pointer;
            border: 1px solid var(--accent-color);
            background: transparent;
            color: var(--accent-color);
            border-radius: 5px;
            transition: 0.3s;
        }

        button.active, button:hover {
            background: var(--accent-color);
            color: white;
        }

        .project-grid {
          display: grid;
          grid-template-columns: repeat(4, 1fr); /* 2 columns */
          gap: 10px;
          padding: 10px;
            /*display: grid;
            align-items: center;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
          grid-template-rows: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;*/
        }

        .project-card {
          width: 300px;
          border: 3px solid #FFFFFF;
          border-radius: 8px;
          overflow: hidden; /* Ensures image corners match card rounding */
          
        }

        .card-img {
          width: 100%; /* Makes image fill the card width */
          height: 200px; /* Optional: standardizes image height */
          object-fit: cover; /* Crops image to fill dimensions without stretching */
        }

        .project-card:hover {
            transform: translateY(-5px);
        }

        .hidden { display: none; 
      }
    </style>
